apiVersion: 1
datasources:
  - name: tado
    uid: tado-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana  # SELECT-only role from db/init.sql
    isDefault: true
    jsonData:
      database: tado
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: grafana
